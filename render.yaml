services:
  - type: web
    name: creator-milestone
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_INVOICER_EMAIL
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      # The public demo may only bill the sandbox buyer accounts listed here (JSON list).
      - key: JUDGE_MODE
        value: "true"
      - key: RECIPIENT_ALLOWLIST
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_API_KEY
        sync: false
